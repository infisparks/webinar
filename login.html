<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Admin Login | First Option Agency Webinar Portal</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
    }
    body {
      background-color: #08080a;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-border-card {
      border: 1px solid rgba(245, 166, 35, 0.35);
      background: linear-gradient(180deg, #141418 0%, #09090c 100%);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(245, 166, 35, 0.15);
    }
    .cta-gold-btn {
      background: linear-gradient(180deg, #ffcf54 0%, #f5a623 100%);
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cta-gold-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(245, 166, 35, 0.55);
    }
  </style>
</head>
<body class="min-h-full flex items-center justify-center p-4 selection:bg-amber-500 selection:text-slate-950">

  <div class="w-full max-w-md space-y-6">
    <!-- Header Logo & Branding -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center space-x-2 bg-amber-500/10 border border-amber-500/30 px-3.5 py-1 rounded-full text-amber-400 text-xs font-bold uppercase tracking-wider">
        <i class="fa-solid fa-shield-halved text-xs"></i>
        <span>Restricted Portal</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Admin Portal Login</h1>
      <p class="text-xs sm:text-sm text-slate-400">First Option Agency • Webinar Lead Management</p>
    </div>

    <!-- Login Card -->
    <div class="hero-border-card rounded-3xl p-6 sm:p-8 space-y-5">
      
      <!-- Error Message Banner -->
      <div id="loginError" class="hidden bg-red-500/15 border border-red-500/40 rounded-xl p-3 text-red-300 text-xs font-bold flex items-start space-x-2">
        <i class="fa-solid fa-circle-exclamation mt-0.5 text-sm flex-shrink-0"></i>
        <span id="loginErrorMsg">Invalid email or password.</span>
      </div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Admin Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-sm">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <input
              type="email"
              id="adminEmail"
              required
              placeholder="admin@firstoptionagency.in"
              class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 rounded-xl pl-10 pr-3.5 py-3 text-sm text-white placeholder-zinc-500 shadow-inner outline-none transition-colors"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-sm">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input
              type="password"
              id="adminPassword"
              required
              placeholder="••••••••••••"
              class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 rounded-xl pl-10 pr-10 py-3 text-sm text-white placeholder-zinc-500 shadow-inner outline-none transition-colors"
            />
            <button
              type="button"
              onclick="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 text-sm focus:outline-none"
            >
              <i id="eyeIcon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="loginBtn"
          class="w-full cta-gold-btn rounded-xl py-3.5 px-4 text-center text-slate-950 font-black text-sm uppercase tracking-wide hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 shadow-lg mt-2 cursor-pointer"
        >
          <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
          <span>SIGN IN TO ADMIN DASHBOARD</span>
        </button>
      </form>

      <div class="pt-2 border-t border-zinc-800 text-center">
        <a href="index.html" class="text-xs text-slate-400 hover:text-amber-400 font-semibold transition-colors inline-flex items-center space-x-1.5">
          <i class="fa-solid fa-arrow-left text-[10px]"></i>
          <span>Back to Webinar Landing Page</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const ALLOWED_ADMIN_UID = "3uVp63ijT3Rb9Z9pdhLj8UkpFS62";

    const firebaseConfig = {
      apiKey: "AIzaSyCKq8zf-1Lmod_ac7KKpXstr7uXZz_f1PQ",
      authDomain: "webinarfirst.firebaseapp.com",
      projectId: "webinarfirst",
      storageBucket: "webinarfirst.firebasestorage.app",
      messagingSenderId: "566630866467",
      appId: "1:566630866467:web:5e132421e144534c139b96"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Check if already authenticated
    auth.onAuthStateChanged((user) => {
      if (user && user.uid === ALLOWED_ADMIN_UID) {
        window.location.href = "admin.html";
      }
    });

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById("adminPassword");
      const eyeIcon = document.getElementById("eyeIcon");
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
      } else {
        pwdInput.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      const errorDiv = document.getElementById("loginError");
      const errorMsg = document.getElementById("loginErrorMsg");
      const loginBtn = document.getElementById("loginBtn");

      errorDiv.classList.add("hidden");
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-sm"></i><span>Verifying credentials...</span>`;

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        if (user.uid === ALLOWED_ADMIN_UID) {
          window.location.href = "admin.html";
        } else {
          // Logged in user is not authorized as superadmin
          await auth.signOut();
          errorMsg.innerText = "Access denied: This user account does not have admin permissions.";
          errorDiv.classList.remove("hidden");
          loginBtn.disabled = false;
          loginBtn.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket text-sm"></i><span>SIGN IN TO ADMIN DASHBOARD</span>`;
        }
      } catch (err) {
        console.error("Login failed:", err);
        errorMsg.innerText = err.message || "Failed to sign in. Please verify your email and password.";
        errorDiv.classList.remove("hidden");
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket text-sm"></i><span>SIGN IN TO ADMIN DASHBOARD</span>`;
      }
    }
  </script>
</body>
</html>
